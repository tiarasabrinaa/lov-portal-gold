steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "asia-southeast2-docker.pkg.dev/sandbox-lov/cloud-run-source-deploy/lov-portal-api"
      - .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "asia-southeast2-docker.pkg.dev/sandbox-lov/cloud-run-source-deploy/lov-portal-api"

  # gcloud run deploy cuma bisa 1 image - buat sidecar redis (lihat service.yaml)
  # kita pakai "services replace" yang baca spec multi-container dari YAML.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - services
      - replace
      - service.yaml
      - "--region=asia-southeast2"

  # "services replace" ga bawa IAM policy - pastiin tetep public (idempotent, aman dipanggil tiap deploy)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - lov-portal-gold-git
      - "--region=asia-southeast2"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

images:
  - "asia-southeast2-docker.pkg.dev/sandbox-lov/cloud-run-source-deploy/lov-portal-api"

options:
  logging: CLOUD_LOGGING_ONLY
