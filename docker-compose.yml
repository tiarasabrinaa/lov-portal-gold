services:
  api:
    build: .
    container_name: lov-portal-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      BIGQUERY_PROJECT: sandbox-lov
      BIGQUERY_DATASET: lov_gold
      BIGQUERY_LOCATION: asia-southeast2
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sandbox-lov-760ab321486a.json
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: lov_gold
      POSTGRES_USER: lov_app
      POSTGRES_PASSWORD: lov_app_local_only
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./secrets/sandbox-lov-760ab321486a.json:/secrets/sandbox-lov-760ab321486a.json:ro
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: lov-portal-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: lov-portal-postgres
    environment:
      POSTGRES_DB: lov_gold
      POSTGRES_USER: lov_app
      POSTGRES_PASSWORD: lov_app_local_only
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  pg_data: